# Copy to secrets.yaml. Replace every placeholder locally; never commit it.
wifi_ssid: "YOUR_NETWORK"
wifi_password: "YOUR_NETWORK_PASSWORD"
moon_node_api_key: "REPLACE_WITH_UNIQUE_32_BYTE_BASE64_API_KEY"
moon_node_ota_password: "REPLACE_WITH_UNIQUE_OTA_PASSWORD"

# Decimal degrees as quoted strings; north/east positive, south/west negative.
# 0,0 is a public placeholder. Replace it for your own installation.
observer_latitude: "0.0000"
observer_longitude: "0.0000"
observer_elevation_m: "0.0"
